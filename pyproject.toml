[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweeper-scanner"
version = "0.1.0"
description = "Black-box infrastructure and web security scanner"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "je-lv"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["security", "infrastructure", "reconnaissance", "scanner", "pentest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "Jinja2>=3.1,<4",
  "PyYAML>=6,<7",
  "rich>=13,<15",
]

[project.urls]
Homepage = "https://github.com/je-lv/sweeper"
Repository = "https://github.com/je-lv/sweeper"
Issues = "https://github.com/je-lv/sweeper/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
sweeper = "sweeper.app:main"

[tool.setuptools.packages.find]
include = ["sweeper*"]

[tool.setuptools.package-data]
sweeper = ["templates/*.j2"]
