[extend]
useDefault = true

# Sweeper's secret-detection tests require credential-shaped input. These are
# fixed, synthetic values used only as assertions and fixtures. Keep exclusions
# value-specific so newly introduced credentials are still reported.
[[allowlists]]
description = "Synthetic credential-shaped values used by secret detection tests"
regexTarget = "secret"
regexes = [
  '''^AIzaSyA1234567890abcdefghijklmnopqrstuv$''',
  '''^AIzaSyA1234567890abcdefghijklmnopqrstuvXX$''',
  '''^AKIAABCDEFGHIJKLMNOP$''',
  '''^ZxQm2vLp8Rt5Yw3Nc7Bf1Kd6Hs4Ej0GaUlp9$''',
  '''^sk_live_51H8xQ2eZvKYlo2CabcdefghijklmnopQ$''',
  '''^sk_live_9f3c2b7a1e4d6a8b0c2e4f6a8b0c2e4f$''',
  '''^sk_test_4eC39HqLyjWDarjtT1zdp7dc$''',
  '''^sk_test_51H8xQ2eZvKYlo2CabcdefghijklmnopQ$''',
  '''^xoxb-123456789012-1234567890123-AbCdEfGhIjKlMnOpQrStUvWx$''',
]
