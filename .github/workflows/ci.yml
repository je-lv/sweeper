name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run test suite
        run: python -m pytest -q
      - name: Build distributable artifacts
        if: matrix.python-version == '3.12'
        run: python -m pip install build && python -m build
      - name: Verify wheel installation
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/sweeper-wheel
          /tmp/sweeper-wheel/bin/pip install dist/*.whl
          /tmp/sweeper-wheel/bin/pip check
          /tmp/sweeper-wheel/bin/sweeper --help
